<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin DLH - eLOLA</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="navbar">
      <span class="navbar-brand">eLOLA Admin DLH / Kelurahan</span>
      <div class="nav-links">
        <a href="dashboard.html" style="color: var(--primary-dark)"
          >Dashboard</a
        >
        <a href="../peringkat.html">Peringkat RT</a>
        <button
          id="btn-logout"
          class="btn btn-danger"
          style="padding: 5px 10px"
        >
          Keluar
        </button>
      </div>
    </div>

    <div class="container">
      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 14px;
          margin-bottom: 20px;
        "
      >
        <div class="card" style="text-align: center; margin-bottom: 0">
          <div style="font-size: 0.8rem; color: var(--text-muted)">
            Total Volume Sampah
          </div>
          <h2
            id="kpi-volume"
            style="color: var(--primary-dark); margin-top: 4px"
          >
            0 Kg
          </h2>
        </div>
        <div class="card" style="text-align: center; margin-bottom: 0">
          <div style="font-size: 0.8rem; color: var(--text-muted)">
            Total Poin Warga
          </div>
          <h2 id="kpi-poin" style="color: var(--primary-dark); margin-top: 4px">
            0 Pts
          </h2>
        </div>
        <div class="card" style="text-align: center; margin-bottom: 0">
          <div style="font-size: 0.8rem; color: var(--text-muted)">
            ASN Terdata
          </div>
          <h2 id="kpi-asn" style="color: var(--primary-dark); margin-top: 4px">
            0 Orang
          </h2>
        </div>
        <div class="card" style="text-align: center; margin-bottom: 0">
          <div style="font-size: 0.8rem; color: var(--text-muted)">
            Kepatuhan ASN (≥2 Kg)
          </div>
          <h2
            id="kpi-kepatuhan"
            style="color: var(--primary-dark); margin-top: 4px"
          >
            0%
          </h2>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Kepatuhan ASN per Instansi Bulan Berjalan</div>
        <div id="asn-list">Memuat kepatuhan...</div>
      </div>
    </div>

    <script type="module" src="../js/dashboard.js"></script>
  </body>
</html>
