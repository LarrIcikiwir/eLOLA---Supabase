<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eLOLA - Masuk / Daftar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 60px;">
    <div class="card">
      <h2 style="color: var(--primary-dark); text-align: center; margin-bottom: 6px;">eLOLA</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Bank Sampah Digital</p>
      
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button id="tab-login" type="button" class="btn btn-primary" style="flex: 1;">Masuk</button>
        <button id="tab-register" type="button" class="btn btn-outline" style="flex: 1;">Daftar</button>
      </div>

      <!-- Form Login -->
      <form id="form-login">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" required placeholder="Masukkan username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="******">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Masuk</button>
      </form>

      <!-- Form Register -->
      <form id="form-register" style="display: none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reg-username" required placeholder="Contoh: budi01" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" required minlength="6" placeholder="Minimal 6 karakter">
        </div>
        <div class="form-group">
          <label>Nomor RT</label>
          <input type="text" id="reg-rt" required placeholder="Contoh: RT03 atau 03">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Daftar Sekarang</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./js/supabase-config.js";
    import { showToast } from "./js/utils.js";

    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("form-login");
    const formRegister = document.getElementById("form-register");

    tabLogin.onclick = () => {
      formLogin.style.display = "block";
      formRegister.style.display = "none";
      tabLogin.className = "btn btn-primary";
      tabRegister.className = "btn btn-outline";
    };

    tabRegister.onclick = () => {
      formLogin.style.display = "none";
      formRegister.style.display = "block";
      tabRegister.className = "btn btn-primary";
      tabLogin.className = "btn btn-outline";
    };

    // Helper: format username menjadi email internal Supabase
    const toInternalEmail = (u) => `${u.trim().toLowerCase()}@elola.local`;

    // 1. Proses Login
    formLogin.onsubmit = async (e) => {
      e.preventDefault();
      const rawUser = document.getElementById("login-username").value;
      const password = document.getElementById("login-password").value;
      const fakeEmail = toInternalEmail(rawUser);

      const { data, error } = await supabase.auth.signInWithPassword({
        email: fakeEmail,
        password: password
      });

      if (error) {
        showToast("Login gagal: Username atau password salah.", "error");
        return;
      }

      // Ambil peran user untuk redirect
      const { data: profile } = await supabase
        .from("profiles")
        .select("peran")
        .eq("id", data.user.id)
        .single();

      if (profile?.peran === "warga") window.location.href = "warga/setoran.html";
      else if (profile?.peran === "petugas") window.location.href = "petugas/verifikasi.html";
      else if (profile?.peran === "admin") window.location.href = "admin/dashboard.html";
    };

    // 2. Proses Daftar
    formRegister.onsubmit = async (e) => {
      e.preventDefault();
      const rawUser = document.getElementById("reg-username").value.trim().toLowerCase();
      const password = document.getElementById("reg-password").value;
      let rt = document.getElementById("reg-rt").value.trim().toUpperCase();
      if (!rt.startsWith("RT")) rt = "RT" + rt; // Standarisasi format RT

      const fakeEmail = toInternalEmail(rawUser);

      // Cek apakah username sudah dipakai
      const { data: existingUser } = await supabase
        .from("profiles")
        .select("id")
        .eq("username", rawUser)
        .maybeSingle();

      if (existingUser) {
        showToast("Username sudah digunakan, pilih username lain.", "error");
        return;
      }

      // Registrasi ke Auth
      const { data, error: authErr } = await supabase.auth.signUp({
        email: fakeEmail,
        password: password
      });

      if (authErr) {
        showToast("Gagal daftar: " + authErr.message, "error");
        return;
      }

      // Simpan data profil warga
      const { error: profErr } = await supabase.from("profiles").insert([{
        id: data.user.id,
        nama: rawUser,
        username: rawUser,
        peran: "warga",
        kelurahan: "Lalolara",
        rt: rt,
        unit_bank_sampah: "Unit Kelurahan",
        saldo_poin: 0,
        total_kg: 0
      }]);

      if (profErr) {
        showToast("Gagal menyimpan profil: " + profErr.message, "error");
      } else {
        showToast("Pendaftaran berhasil!");
        window.location.href = "warga/setoran.html";
      }
    };
  </script>
</body>
</html>
