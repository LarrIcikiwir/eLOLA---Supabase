<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eLOLA – Masuk & Daftar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="kartu">
  <section class="kiri">
    <div class="logo">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <rect width="42" height="42" rx="11" fill="#58b45d"/>
        <path d="M21 9c-6 5-8 10-8 14a8 8 0 0 0 16 0c0-4-2-9-8-14z" fill="#fff"/>
        <path d="M21 14v17" stroke="#58b45d" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div><b>eLOLA</b><small>Bank Sampah Digital</small></div>
    </div>
    <div>
      <h2>Buku tabungan sampah, <em>versi digital</em> untuk seluruh warga.</h2>
      <p>Setiap setoran sampah jadi poin yang tersimpan aman.</p>
    </div>
  </section>

  <section class="kanan">
    <div class="peran" role="group">
      <button type="button" id="pWarga" class="aktif">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>
        <b>Warga</b><span>Setor sampah &amp; tabung poin</span>
      </button>
      <button type="button" id="pPetugas">
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <b>Petugas / Admin</b><span>Verifikasi timbangan sampah</span>
      </button>
    </div>

    <div class="tab">
      <button type="button" id="tMasuk" class="aktif">Masuk</button>
      <button type="button" id="tDaftar">Daftar Akun</button>
    </div>

    <form id="fMasuk" novalidate>
      <label for="idMasuk" id="lblIdMasuk">Nama Lengkap</label>
      <input id="idMasuk" type="text" autocomplete="username" placeholder="Masukkan nama Anda">
      <label for="sMasuk">Kata Sandi</label>
      <div class="sandi">
        <input id="sMasuk" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="lihat" data-t="sMasuk">
          <svg class="mata-tutup" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A10.6 10.6 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.7C3.9 8.5 2 12 2 12s3.5 6 10 6c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          <svg class="mata-buka" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="pesan" id="pMasuk"></p>
      <button class="tombol" id="btnMasuk" type="submit">Masuk ke eLOLA →</button>
    </form>

    <form id="fDaftar" class="hidden" novalidate>
      <label for="nama">Nama Lengkap</label>
      <input id="nama" type="text" autocomplete="name" placeholder="Contoh: Budi Santoso">
      <label for="rt">Nomor RT</label>
      <select id="rt">
        <option value="">Pilih RT</option>
        <option value="RT 01">RT 01</option>
        <option value="RT 02">RT 02</option>
        <option value="RT 03" selected>RT 03</option>
        <option value="RT 04">RT 04</option>
        <option value="RT 05">RT 05</option>
      </select>
      <label for="sDaftar">Kata Sandi (minimal 6 karakter)</label>
      <div class="sandi">
        <input id="sDaftar" type="password" autocomplete="new-password" placeholder="••••••••">
        <button type="button" class="lihat" data-t="sDaftar">
          <svg class="mata-tutup" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A10.6 10.6 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.7C3.9 8.5 2 12 2 12s3.5 6 10 6c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          <svg class="mata-buka" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="pesan" id="pDaftar"></p>
      <button class="tombol" id="btnDaftar" type="submit">Buat akun eLOLA →</button>
    </form>

    <p class="bantuan" id="bantuan"></p>
  </section>
</main>

<script type="module" src="js/auth.js"></script>
</body>
</html>
