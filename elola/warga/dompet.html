<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dompet Poin - eLOLA</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="navbar">
      <a href="setoran.html" class="navbar-brand">eLOLA Warga</a>
      <div class="nav-links">
        <a href="setoran.html">Setor</a>
        <a href="dompet.html" style="color: var(--primary-dark)">Dompet Poin</a>
        <a href="../peringkat.html">Peringkat</a>
        <button
          id="btn-logout"
          class="btn btn-danger"
          style="padding: 5px 10px"
        >
          Keluar
        </button>
      </div>
    </div>

    <div class="container">
      <div
        class="card"
        style="
          background: linear-gradient(135deg, #059669, #10b981);
          color: white;
        "
      >
        <div style="font-size: 0.85rem; opacity: 0.9">Saldo Tabungan Poin</div>
        <h1 id="saldo-poin" style="font-size: 2.2rem; margin: 4px 0">0 Pts</h1>
        <div id="saldo-rupiah" style="font-size: 0.95rem; opacity: 0.9">
          Setara Rp 0
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-header">Katalog Hadiah</div>
          <div id="reward-list">Memuat katalog...</div>
        </div>

        <div class="card">
          <div class="card-header">Riwayat Mutasi Poin</div>
          <div id="riwayat-list">Memuat mutasi...</div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/dompet.js"></script>
  </body>
</html>
