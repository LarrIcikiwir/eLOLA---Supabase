<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setor Sampah - eLOLA</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="navbar">
      <a href="setoran.html" class="navbar-brand">eLOLA Warga</a>
      <div class="nav-links">
        <a href="setoran.html" style="color: var(--primary-dark)">Setor</a>
        <a href="dompet.html">Dompet Poin</a>
        <a href="../peringkat.html">Peringkat</a>
        <button
          id="btn-logout"
          class="btn btn-danger"
          style="padding: 5px 10px"
        >
          Keluar
        </button>
      </div>
    </div>

    <div class="container">
      <div class="grid-2">
        <div class="card">
          <div class="card-header">Formulir Setor Sampah</div>
          <form id="form-setor">
            <div class="form-group">
              <label>Kategori Sampah</label>
              <select id="kategori-select" required></select>
            </div>
            <div class="form-group">
              <label>Estimasi Berat (Kg)</label>
              <input
                type="number"
                step="0.1"
                id="estimasi-kg"
                required
                placeholder="Contoh: 2.5"
              />
            </div>
            <div class="form-group">
              <label>Foto Bukti Sampah</label>
              <input type="file" id="foto-sampah" accept="image/*" required />
            </div>
            <p
              id="est-poin-box"
              style="
                font-size: 0.9rem;
                color: var(--primary-dark);
                margin-bottom: 12px;
                font-weight: 600;
              "
            ></p>
            <button
              type="submit"
              id="btn-submit"
              class="btn btn-primary"
              style="width: 100%"
            >
              Kirim Setoran
            </button>
          </form>
        </div>

        <div class="card">
          <div class="card-header">Riwayat Setoran Terbaru</div>
          <div id="list-setoran">Memuat setoran...</div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/setoran.js"></script>
  </body>
</html>
